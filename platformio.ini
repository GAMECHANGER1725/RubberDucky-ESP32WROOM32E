; PlatformIO project for the ESP32-WROOM-32E BLE Rubber Ducky
; Build/upload with:  pio run -t upload   (then)  pio device monitor
;
; NOTE: The classic ESP32-WROOM-32E has NO native USB. This firmware injects
; keystrokes over Bluetooth LE (BLE HID keyboard), not over the USB cable.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; BLE + WiFi + web server is a big binary, so use a large app partition.
; huge_app.csv = 3MB app / no OTA / ~1MB filesystem (used by LittleFS at runtime).
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs

; Use the lighter NimBLE stack so BLE + WiFi can coexist on the ESP32.
build_flags =
    -D USE_NIMBLE

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
    https://github.com/T-vK/ESP32-BLE-Keyboard.git
